name: mcommerce_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/higop_icon_v3.png"
  adaptive_icon_background: "#EBE2D3"
  adaptive_icon_foreground: "assets/icon/higop_icon_padded.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/higop_icon_v3.png"

flutter_native_splash:
  color: "#EBE2D3"
  image: "assets/icon/higop_icon_padded.png"
  android_12:
    color: "#EBE2D3"
    image: "assets/icon/higop_icon_padded.png"